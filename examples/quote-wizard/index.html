<!doctype html>
<html lang="en" data-publishable-key="pk_local_configure_me" data-endpoint="http://127.0.0.1:8797">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Quote Wizard — Dermoptera Handoff Sample</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <p class="eyebrow">Generic state transfer demonstration</p>
    <h1>Home project quote</h1>
    <p id="status" role="status"></p>
    <form id="wizard">
      <section data-step="1">
        <h2>1. Project</h2>
        <label>Project type <select name="projectType"><option value="">Choose…</option><option>Kitchen</option><option>Bathroom</option><option>Garden office</option></select></label>
      </section>
      <section data-step="2" hidden>
        <h2>2. Size</h2>
        <label>Approximate area <input name="area" type="number" min="1" max="500"> m²</label>
      </section>
      <section data-step="3" hidden>
        <h2>3. Timing</h2>
        <label>Preferred start <select name="timing"><option value="">Choose…</option><option>Within 1 month</option><option>1–3 months</option><option>Later</option></select></label>
      </section>
      <section data-step="4" hidden>
        <h2>4. Review</h2>
        <pre id="review"></pre>
      </section>
      <div class="actions"><button type="button" id="back">Back</button><button type="button" id="next">Next</button></div>
    </form>
    <section class="handoff">
      <h2>Continue on another device</h2>
      <p>Move this quote progress through a one-time encrypted link.</p>
      <button type="button" id="create">Create QR</button>
      <div id="qr-panel" hidden><canvas id="qr" width="240" height="240"></canvas><p id="expires"></p><a id="claim-link" target="_blank" rel="noopener">Open receive link in this browser</a></div>
    </section>
    <button type="button" id="clear" class="quiet">Clear this browser's sample state</button>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
